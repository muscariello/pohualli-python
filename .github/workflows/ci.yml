name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies with uv (editable for accurate coverage paths)
        run: |
          uv pip install --system -e '.[dev,web]' build

      - name: Run tests (coverage on 3.12 only)
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then \
            python -m coverage run -m pytest -q; \
            echo "Listing raw coverage data files (parallel mode)"; \
            ls -1 .coverage* || true; \
            python -m coverage combine || true; \
            python -m coverage report -m; \
            python -m coverage xml; \
          else \
            python -m pytest -q; \
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build package
        run: |
          python -m build

      - name: Upload dist artifacts (single version)
        # Only publish artifacts for pushes to main or tag refs (not PRs)
        if: matrix.python-version == '3.12' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
